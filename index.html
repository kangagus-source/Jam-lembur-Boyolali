<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gaji Lembur Boyolali by : Kang Agus</title>
    <style>
        /* Mengunci halaman utama agar tidak bisa di-scroll seluruhnya */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f7f5f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }
        /* Container dibuat flex vertikal agar tingginya pas dengan layar HP */
        .container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 95vh; /* Membatasi tinggi agar tidak mentok layar atas bawah */
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        
        /* Elemen Atas (Tetap Diam) */
        .header {
            background-color: #4b6033;
            color: white;
            padding: 15px 20px;
            flex-shrink: 0;
        }
        .header h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }
        .btn-pdf {
            background-color: #7d5a44;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
        }
        .info-box {
            background-color: #fcf9f2;
            margin: 12px 15px;
            padding: 12px;
            border-radius: 15px;
            border-left: 5px solid #4b6033;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .info-item {
            width: 48%;
            margin-bottom: 5px;
        }
        .info-item span {
            display: block;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
        }
        .info-item strong {
            font-size: 14px;
            color: #222;
        }
        .form-group {
            margin: 0 15px 10px 15px;
            flex-shrink: 0;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #666;
            margin-bottom: 4px;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin: 0 15px 10px 15px;
            flex-shrink: 0;
        }
        .form-row .form-group {
            margin: 0;
            flex: 1;
        }
        input[type="text"], input[type="date"], input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 13px;
        }
        .btn-refresh {
            background-color: #7d5a44;
            color: white;
            width: calc(100% - 30px);
            margin: 0 15px 10px 15px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* 🔄 AREA TABEL (HANYA INI YANG BISA DI-SLIDE / SCROLL) */
        .table-container {
            margin: 0 15px;
            flex-grow: 1; /* Mengisi sisa ruang yang kosong */
            overflow-y: auto; /* Mengaktifkan scroll vertikal */
            -webkit-overflow-scrolling: touch; /* Efek scroll halus di HP iPhone/Android */
            border: 1px solid #eee;
            border-radius: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13px;
        }
        th {
            background-color: #f5f0e6;
            color: #555;
            padding: 10px;
            position: sticky;
            top: 0; /* Judul kolom tabel tetap diam saat baris di-slide */
            z-index: 1;
        }
        td {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        .input-jam {
            width: 50px;
            text-align: center;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Elemen Bawah (Tetap Diam) */
        .footer-actions {
            display: flex;
            gap: 8px;
            margin: 10px 15px;
            flex-shrink: 0;
        }
        .btn-action {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .total-box {
            background-color: #4b6033;
            color: white;
            margin: 0 15px 15px 15px;
            padding: 12px;
            text-align: center;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            flex-shrink: 0;
        }

        #file-input-pulih {
            display: none;
        }

        /* Tampilan khusus untuk Cetak PDF */
        @media print {
            html, body {
                overflow: visible !important;
                height: auto !important;
            }
            .container {
                max-height: none !important;
                box-shadow: none;
                max-width: 100%;
                border-radius: 0;
                display: block;
            }
            .btn-pdf, .btn-refresh, .footer-actions, .form-row, .form-group {
                display: none !important;
            }
            .table-container {
                max-height: none !important;
                overflow: visible !important;
                margin: 0;
                border: none;
            }
            th {
                background-color: #f5f0e6 !important;
                position: static;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .header, .total-box {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .input-jam {
                border: none !important;
                background: transparent !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Gaji Lembur Boyolali by : Kang Agus</h2>
        <button class="btn-pdf" onclick="cetakPDF()">📄 Simpan PDF</button>
    </div>

    <div class="info-box">
        <div class="info-item">
            <span>UMK 2026</span>
            <strong>Rp2.537.949</strong>
        </div>
        <div class="info-item">
            <span>Periode Gaji</span>
            <strong>26 ➔ 25 (bayar tgl 5)</strong>
        </div>
        <div class="info-item" style="width: 100%;">
            <span>Upah Per Jam (1/173)</span>
            <strong>Rp14.670</strong>
        </div>
    </div>

    <div class="form-group">
        <label>💵 GAJI POKOK (RP)</label>
        <input type="number" id="gaji-pokok" value="2537949">
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>📅 MULAI (26)</label>
            <input type="date" id="start-date" value="2026-05-26">
        </div>
        <div class="form-group">
            <label>📅 AKHIR (25)</label>
            <input type="date" id="end-date" value="2026-06-25">
        </div>
    </div>

    <button class="btn-refresh" id="btn-refresh">🔄 Refresh</button>

    <!-- Tempat tabel yang bisa digulung naik-turun -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Hari</th>
                    <th>Jam Lembur</th>
                    <th>Libur</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="footer-actions">
        <button class="btn-action" onclick="cadangkanData()">📥 Cadangkan</button>
        <button class="btn-action" onclick="pemicuPuluhkanData()">📤 Pulihkan</button>
        <button class="btn-action" onclick="resetSemuaData()" style="color: #e74c3c;">⚠️ Clear</button>
    </div>
    
    <input type="file" id="file-input-pulih" accept=".txt" onchange="pulihkanData(this)">

    <div class="total-box" id="total-lembur-box">
        Total Uang Lembur: Rp 0
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', muatDataAwal);
    document.getElementById('btn-refresh').addEventListener('click', function() {
        generateTable();
    });

    function muatDataAwal() {
        const savedStart = localStorage.getItem('savedStartDate');
        const savedEnd = localStorage.getItem('savedEndDate');
        
        if (savedStart && savedEnd) {
            document.getElementById('start-date').value = savedStart;
            document.getElementById('end-date').value = savedEnd;
        }
        generateTable();
    }

    function generateTable() {
        const startDateInput = document.getElementById('start-date').value;
        const endDateInput = document.getElementById('end-date').value;
        const tableBody = document.getElementById('table-body');
        
        tableBody.innerHTML = '';

        if (!startDateInput || !endDateInput) {
            alert('Mohon tentukan tanggal mulai dan akhir!');
            return;
        }

        let start = new Date(startDateInput);
        let end = new Date(endDateInput);

        if (start > end) {
            alert('Tanggal mulai tidak boleh melewati tanggal akhir!');
            return;
        }

        localStorage.setItem('savedStartDate', startDateInput);
        localStorage.setItem('savedEndDate', endDateInput);

        const opsiHari = { weekday: 'long' };

        const dataLemburTersimpan = JSON.parse(localStorage.getItem('dataLembur')) || {};
        const dataLiburTersimpan = JSON.parse(localStorage.getItem('dataLibur')) || {};
        
        while (start <= end) {
            const namaHari = start.toLocaleDateString('id-ID', opsiHari);
            const isSabtuMinggu = (namaHari === 'Sabtu' || namaHari === 'Minggu');
            
            const tgl = String(start.getDate()).padStart(2, '0');
            const bln = String(start.getMonth() + 1).padStart(2, '0');
            const thn = start.getFullYear();
            const formatTglTampil = `${tgl}/${bln}/${thn}`;

            const nilaiJam = dataLemburTersimpan[formatTglTampil] !== undefined ? dataLemburTersimpan[formatTglTampil] : '';
            const statusLibur = dataLiburTersimpan[formatTglTampil] !== undefined ? dataLiburTersimpan[formatTglTampil] : isSabtuMinggu;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${formatTglTampil}</td>
                <td>${namaHari}</td>
                <td>
                    <input type="number" step="0.5" min="0" class="input-jam" placeholder="0" 
                           value="${nilaiJam}" 
                           data-tanggal="${formatTglTampil}" 
                           oninput="simpanJamKeStorage(this)">
                </td>
                <td>
                    <input type="checkbox" class="check-libur" 
                           ${statusLibur ? 'checked' : ''} 
                           data-tanggal="${formatTglTampil}" 
                           onchange="simpanLiburKeStorage(this)">
                </td>
            `;
            tableBody.appendChild(row);

            start.setDate(start.getDate() + 1);
        }
        
        hitungTotalLembur();
    }

    function simpanJamKeStorage(inputElement) {
        const tgl = inputElement.getAttribute('data-tanggal');
        const nilai = inputElement.value;

        let dataLemburTersimpan = JSON.parse(localStorage.getItem('dataLembur')) || {};
        dataLemburTersimpan[tgl] = nilai;
        localStorage.setItem('dataLembur', JSON.stringify(dataLemburTersimpan));

        hitungTotalLembur();
    }

    function simpanLiburKeStorage(checkboxElement) {
        const tgl = checkboxElement.getAttribute('data-tanggal');
        const status = checkboxElement.checked;

        let dataLiburTersimpan = JSON.parse(localStorage.getItem('dataLibur')) || {};
        dataLiburTersimpan[tgl] = status;
        localStorage.setItem('dataLibur', JSON.stringify(dataLiburTersimpan));

        hitungTotalLembur();
    }

    function hitungTotalLembur() {
        const upahPerJam = 14670;
        let totalUangLembur = 0;
        
        const rows = document.querySelectorAll('#table-body tr');
        
        rows.forEach(row => {
            const jamInput = row.querySelector('.input-jam').value;
            const isLibur = row.querySelector('.check-libur').checked;
            
            let jamLembur = parseFloat(jamInput) || 0;
            
            if (jamLembur > 0) {
                let upahHariIni = 0;
                
                if (!isLibur) {
                    if (jamLembur <= 1) {
                        upahHariIni = jamLembur * 1.5 * upahPerJam;
                    } else {
                        upahHariIni = (1 * 1.5 * upahPerJam) + ((jamLembur - 1) * 2 * upahPerJam);
                    }
                } else {
                    if (jamLembur <= 8) {
                        upahHariIni = jamLembur * 2 * upahPerJam;
                    } else if (jamLembur === 9) {
                        upahHariIni = (8 * 2 * upahPerJam) + (1 * 3 * upahPerJam);
                    } else {
                        upahHariIni = (8 * 2 * upahPerJam) + (1 * 3 * upahPerJam) + ((jamLembur - 9) * 4 * upahPerJam);
                    }
                }
                totalUangLembur += upahHariIni;
            }
        });

        document.getElementById('total-lembur-box').innerText = `Total Uang Lembur: Rp ${Math.round(totalUangLembur).toLocaleString('id-ID')}`;
    }

    // PDF
    function cetakPDF() {
        window.print();
    }

    // Clear Memori
    function resetSemuaData() {
        if(confirm("Apakah Anda ingin membersihkan seluruh data lembur yang tersimpan untuk memulai bulan baru?")) {
            localStorage.clear();
            document.getElementById('start-date').value = "2026-05-26";
            document.getElementById('end-date').value = "2026-06-25";
            generateTable();
        }
    }

    // Cadangkan
    function cadangkanData() {
        const backupData = {
            savedStartDate: localStorage.getItem('savedStartDate') || '',
            savedEndDate: localStorage.getItem('savedEndDate') || '',
            dataLembur: JSON.parse(localStorage.getItem('dataLembur')) || {},
            dataLibur: JSON.parse(localStorage.getItem('dataLibur')) || {}
        };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
        const downloadAnchor = document.createElement('a');
        const tglSkg = new Date().toISOString().slice(0,10);
        
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Backup_Lembur_Boyolali_${tglSkg}.txt`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    // Pulihkan
    function pemicuPuluhkanData() {
        document.getElementById('file-input-pulih').click();
    }

    function pulihkanData(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const dataDiPulihkan = JSON.parse(e.target.result);
                
                if (dataDiPulihkan.dataLembur && dataDiPulihkan.dataLibur) {
                    localStorage.setItem('savedStartDate', dataDiPulihkan.savedStartDate);
                    localStorage.setItem('savedEndDate', dataDiPulihkan.savedEndDate);
                    localStorage.setItem('dataLembur', JSON.stringify(dataDiPulihkan.dataLembur));
                    localStorage.setItem('dataLibur', JSON.stringify(dataDiPulihkan.dataLibur));
                    
                    alert('Data lembur berhasil dipulihkan secara penuh!');
                    muatDataAwal();
                } else {
                    alert('Format berkas cadangan salah atau tidak valid!');
                }
            } catch (err) {
                alert('Gagal membaca file cadangan. Pastikan file berupa berkas txt cadangan yang benar!');
            }
        };
        reader.readAsText(file);
        input.value = '';
    }
</script>

</body>
</html>
