<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaji Lembur Boyolali by : Kang Agus</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f5f0;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .header {
            background-color: #4b6033;
            color: white;
            padding: 20px;
        }
        .header h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }
        .btn-pdf {
            background-color: #7d5a44;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
        }
        .info-box {
            background-color: #fcf9f2;
            margin: 15px;
            padding: 15px;
            border-radius: 15px;
            border-left: 5px solid #4b6033;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .info-item {
            width: 48%;
            margin-bottom: 10px;
        }
        .info-item span {
            display: block;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
        }
        .info-item strong {
            font-size: 16px;
            color: #222;
        }
        .form-group {
            margin: 0 15px 12px 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #666;
            margin-bottom: 5px;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin: 0 15px 12px 15px;
        }
        .form-row .form-group {
            margin: 0;
            flex: 1;
        }
        input[type="text"], input[type="date"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-refresh {
            background-color: #7d5a44;
            color: white;
            width: calc(100% - 30px);
            margin: 0 15px 15px 15px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .table-container {
            margin: 0 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13px;
        }
        th {
            background-color: #f5f0e6;
            color: #555;
            padding: 10px;
            position: sticky;
            top: 0;
        }
        td {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        .input-jam {
            width: 50px;
            text-align: center;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .footer-actions {
            display: flex;
            gap: 10px;
            margin: 15px;
        }
        .btn-action {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
        }
        .total-box {
            background-color: #4b6033;
            color: white;
            margin: 15px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Gaji Lembur Boyolali by : Kang Agus</h2>
        <button class="btn-pdf">📄 Simpan PDF</button>
    </div>

    <div class="info-box">
        <div class="info-item">
            <span>UMK 2026</span>
            <strong>Rp2.537.949</strong>
        </div>
        <div class="info-item">
            <span>Periode Gaji</span>
            <strong>26 ➔ 25 (bayar tgl 5)</strong>
        </div>
        <div class="info-item" style="width: 100%;">
            <span>Upah Per Jam (1/173)</span>
            <strong>Rp14.670</strong>
        </div>
    </div>

    <div class="form-group">
        <label>💵 GAJI POKOK (RP)</label>
        <input type="number" id="gaji-pokok" value="2537949">
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>📅 MULAI (26)</label>
            <input type="date" id="start-date" value="2026-05-26">
        </div>
        <div class="form-group">
            <label>📅 AKHIR (25)</label>
            <input type="date" id="end-date" value="2026-06-25">
        </div>
    </div>

    <button class="btn-refresh" id="btn-refresh">🔄 Refresh</button>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Hari</th>
                    <th>Jam Lembur</th>
                    <th>Libur</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="footer-actions">
        <button class="btn-action" onclick="resetSemuaData()" style="color: #e74c3c;">⚠️ Clear Memori</button>
        <button class="btn-action">📥 Cadangkan (.txt)</button>
    </div>

    <div class="total-box" id="total-lembur-box">
        Total Uang Lembur: Rp 0
    </div>
</div>

<script>
    // Jalankan otomatis saat halaman pertama kali dibuka (Ambil data lama jika ada)
    window.addEventListener('DOMContentLoaded', muatDataAwal);
    
    // Jalankan saat tombol refresh diklik
    document.getElementById('btn-refresh').addEventListener('click', function() {
        generateTable();
    });

    // Fungsi membaca data simpanan saat awal masuk aplikasi
    function muatDataAwal() {
        const savedStart = localStorage.getItem('savedStartDate');
        const savedEnd = localStorage.getItem('savedEndDate');
        
        if (savedStart && savedEnd) {
            document.getElementById('start-date').value = savedStart;
            document.getElementById('end-date').value = savedEnd;
        }
        // Langsung tampilkan tabelnya
        generateTable();
    }

    function generateTable() {
        const startDateInput = document.getElementById('start-date').value;
        const endDateInput = document.getElementById('end-date').value;
        const tableBody = document.getElementById('table-body');
        
        // Bersihkan tabel sebelum generate ulang
        tableBody.innerHTML = '';

        if (!startDateInput || !endDateInput) {
            alert('Mohon tentukan tanggal mulai dan akhir!');
            return;
        }

        let start = new Date(startDateInput);
        let end = new Date(endDateInput);

        if (start > end) {
            alert('Tanggal mulai tidak boleh melewati tanggal akhir!');
            return;
        }

        // SIMPAN RENTANG TANGGAL PILIHAN USER KE STORAGE
        localStorage.setItem('savedStartDate', startDateInput);
        localStorage.setItem('savedEndDate', endDateInput);

        const opsiHari = { weekday: 'long' };

        // AMBIL DATA JAM LEMBUR & CENTANG LIBUR DARI STORAGE
        const dataLemburTersimpan = JSON.parse(localStorage.getItem('dataLembur')) || {};
        const dataLiburTersimpan = JSON.parse(localStorage.getItem('dataLibur')) || {};
        
        // Loop tanggal
        while (start <= end) {
            const namaHari = start.toLocaleDateString('id-ID', opsiHari);
            const isSabtuMinggu = (namaHari === 'Sabtu' || namaHari === 'Minggu');
            
            // Format tampilan tanggal DD/MM/YYYY
            const tgl = String(start.getDate()).padStart(2, '0');
            const bln = String(start.getMonth() + 1).padStart(2, '0');
            const thn = start.getFullYear();
            const formatTglTampil = `${tgl}/${bln}/${thn}`;

            // Tarik nilai lama atau berikan nilai kosong/default kalender jika belum pernah diisi
            const nilaiJam = dataLemburTersimpan[formatTglTampil] !== undefined ? dataLemburTersimpan[formatTglTampil] : '';
            const statusLibur = dataLiburTersimpan[formatTglTampil] !== undefined ? dataLiburTersimpan[formatTglTampil] : isSabtuMinggu;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${formatTglTampil}</td>
                <td>${namaHari}</td>
                <td>
                    <input type="number" step="0.5" min="0" class="input-jam" placeholder="0" 
                           value="${nilaiJam}" 
                           data-tanggal="${formatTglTampil}" 
                           oninput="simpanJamKeStorage(this)">
                </td>
                <td>
                    <input type="checkbox" class="check-libur" 
                           ${statusLibur ? 'checked' : ''} 
                           data-tanggal="${formatTglTampil}" 
                           onchange="simpanLiburKeStorage(this)">
                </td>
            `;
            tableBody.appendChild(row);

            // Maju ke hari berikutnya
            start.setDate(start.getDate() + 1);
        }
        
        // Reset hitungan awal
        hitungTotalLembur();
    }

    // FUNGSI SIMPAN SETIAP KALI ANGKA JAM DIKETIK
    function simpanJamKeStorage(inputElement) {
        const tgl = inputElement.getAttribute('data-tanggal');
        const nilai = inputElement.value; // simpan string kosong jika dihapus bersih

        let dataLemburTersimpan = JSON.parse(localStorage.getItem('dataLembur')) || {};
        dataLemburTersimpan[tgl] = nilai;
        localStorage.setItem('dataLembur', JSON.stringify(dataLemburTersimpan));

        hitungTotalLembur();
    }

    // FUNGSI SIMPAN SETIAP KALI CEKBOX DI-KLIK
    function simpanLiburKeStorage(checkboxElement) {
        const tgl = checkboxElement.getAttribute('data-tanggal');
        const status = checkboxElement.checked;

        let dataLiburTersimpan = JSON.parse(localStorage.getItem('dataLibur')) || {};
        dataLiburTersimpan[tgl] = status;
        localStorage.setItem('dataLibur', JSON.stringify(dataLiburTersimpan));

        hitungTotalLembur();
    }

    function hitungTotalLembur() {
        const upahPerJam = 14670; // Berdasarkan UMK 2026 (1/173)
        let totalUangLembur = 0;
        
        const rows = document.querySelectorAll('#table-body tr');
        
        rows.forEach(row => {
            const jamInput = row.querySelector('.input-jam').value;
            const isLibur = row.querySelector('.check-libur').checked;
            
            let jamLembur = parseFloat(jamInput) || 0;
            
            if (jamLembur > 0) {
                let upahHariIni = 0;
                
                if (!isLibur) {
                    // Kerja Biasa: Jam pertama x1.5, jam berikutnya x2
                    if (jamLembur <= 1) {
                        upahHariIni = jamLembur * 1.5 * upahPerJam;
                    } else {
                        upahHariIni = (1 * 1.5 * upahPerJam) + ((jamLembur - 1) * 2 * upahPerJam);
                    }
                } else {
                    // Hari Libur Resmi: 8 jam pertama x2, jam ke-9 x3, jam ke-10++ x4
                    if (jamLembur <= 8) {
                        upahHariIni = jamLembur * 2 * upahPerJam;
                    } else if (jamLembur === 9) {
                        upahHariIni = (8 * 2 * upahPerJam) + (1 * 3 * upahPerJam);
                    } else {
                        upahHariIni = (8 * 2 * upahPerJam) + (1 * 3 * upahPerJam) + ((jamLembur - 9) * 4 * upahPerJam);
                    }
                }
                totalUangLembur += upahHariIni;
            }
        });

        // Tampilkan hasil akhir dengan format mata uang rupiah
        document.getElementById('total-lembur-box').innerText = `Total Uang Lembur: Rp ${Math.round(totalUangLembur).toLocaleString('id-ID')}`;
    }

    // FUNGSI TAMBAHAN UNTUK CLEAR DATA BULAN SEBELUMNYA
    function resetSemuaData() {
        if(confirm("Apakah Anda ingin membersihkan seluruh data lembur yang tersimpan untuk memulai bulan baru?")) {
            localStorage.clear();
            // Kembalikan ke default UI Anda
            document.getElementById('start-date').value = "2026-05-26";
            document.getElementById('end-date').value = "2026-06-25";
            generateTable();
        }
    }
</script>

</body>
</html>
